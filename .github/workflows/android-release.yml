name: Build and release APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch: {}

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compute version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            -PappVersionCode="${{ steps.version.outputs.code }}" \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            --no-daemon

      - name: Build unsigned debug-signed APK (no keystore secret configured yet)
        if: env.HAS_KEYSTORE != 'true'
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionCode="${{ steps.version.outputs.code }}" \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-transcriber-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Trascrivi WhatsApp v${{ steps.version.outputs.name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
